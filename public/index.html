<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Student Management System</h1>
    <p class="subtitle">Add, view, edit, and remove student records.</p>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Add Student</h2>
      <form id="student-form">
        <input type="hidden" id="student-id" />
        <div class="grid">
          <label>
            Name *
            <input type="text" id="name" required />
          </label>
          <label>
            Roll No *
            <input type="text" id="roll_no" required />
          </label>
          <label>
            Course *
            <input type="text" id="course" required />
          </label>
          <label>
            Grade
            <input type="text" id="grade" />
          </label>
          <label class="full">
            Email
            <input type="email" id="email" />
          </label>
        </div>
        <div class="actions">
          <button type="submit" id="submit-btn">Add Student</button>
          <button type="button" id="cancel-btn" class="secondary" hidden>Cancel</button>
        </div>
        <p id="form-error" class="error" hidden></p>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>Students</h2>
        <input type="search" id="search" placeholder="Search name, roll, course, email..." />
      </div>
      <div class="table-wrap">
        <table id="students-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Roll No</th>
              <th>Course</th>
              <th>Grade</th>
              <th>Email</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="students-body">
            <tr><td colspan="7" class="empty">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
